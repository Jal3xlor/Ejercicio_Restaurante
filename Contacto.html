    <main class="contenido">
        <h2>Formulario de Contacto</h2>
        <form action="contacto.php" method="post" enctype="multipart/form-data" >
        <fieldset>
            <legend>Datos Personales</legend>
            <div>
                <label>Ingrese su nombre</label>
                <input type="text" name="nombre" id="nombre" required placeholder="ingrese su nombre y apellido" minlength="10" maxlength="10" >
            </div>
            <div>
                <label>Ingrese su DNI</label>
                <input type="text" name="DNI" id="DNI" required placeholder="ingrese su numero de identidad" minlength="13" maxlength="13" pattern="[0-9]{4}-[0-9]{4}-[0-9]{5}" >
            </div>
            <div>
                <label>Ingrese su numero de telefono</label>
                <input type="tel" name="Telefono" id="Telefono" required placeholder="ingrese su numero de telefono" minlength="11" maxlength="11" >
            </div>
            <div>
                <label>Ingrese el asunto</label>
                <input type="text" name="Asunto a tratar" id="asunto" required placeholder="ingrese el motivo para contactarnos" minlength="50" maxlength="100" >
            </div>
            <div>
                <label>Ingrese su direccion</label>
                <input type="text" name="direccion" id="direccion" required placeholder="ingrese su direccion" >
            </div>
            <div>
                
                <button type="submit" > Enviar</button>
            </div>

        </fieldset>
